<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>PTS Compartilhado</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: menu lateral fixo (navegação) + área de trabalho com barra superior (trilha + ações) e conteúdo em painéis/tabelas */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#f7f8fa; --ink:#1d2733; --muted:#5f6b7a; --line:#d9dee4; --line-2:#e8ebef; --field:#c5ccd5;
  --accent:#1a5fb4; --accent-2:#144c91; --accent-soft:#e7eff9; --on-accent:#ffffff;
  --sb:#1c2a3a; --sb-2:#243548; --sb-ink:#b9c6d3; --sb-hi:#ffffff; --sb-line:#2e4258;
  --warn:#975a00; --warn-bg:#fff5e1; --warn-line:#f0d39a;
  --ok:#22703a; --ok-bg:#e9f5ec; --ok-line:#b5dcc0;
  --late:#b42318; --late-bg:#fdeceb; --late-line:#f3bcb7;
  --info-line:#bcd2ee;
  --fisio:#1f6fb8; --fono:#7b4bb0; --nutri:#3a7d23; --psico:#b3426a; --to:#b8660c;
  --paper:#fffffd; --paper-ink:#1d1d1d; --paper-line:#7c7c7c;
  --f-ui:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d; --surface:#171e27; --surface-2:#1c242e; --ink:#e3e8ee; --muted:#97a3b1; --line:#2b3542; --line-2:#242d39; --field:#3a4655;
  --accent:#6ea8ef; --accent-2:#8dbbf3; --accent-soft:#1c2c42; --on-accent:#0b1522;
  --sb:#0d1218; --sb-2:#16202b; --sb-ink:#9fadbb; --sb-hi:#ffffff; --sb-line:#1f2a36;
  --warn:#f2c46b; --warn-bg:#2f2513; --warn-line:#5c4720;
  --ok:#7fcf98; --ok-bg:#16291c; --ok-line:#2b5236;
  --late:#f2958c; --late-bg:#341a18; --late-line:#5e2c27;
  --info-line:#2d4564;
  --fisio:#6ea8ef; --fono:#b48ae6; --nutri:#8ac46a; --psico:#e7889f; --to:#eaa45a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161d; --surface:#171e27; --surface-2:#1c242e; --ink:#e3e8ee; --muted:#97a3b1; --line:#2b3542; --line-2:#242d39; --field:#3a4655;
  --accent:#6ea8ef; --accent-2:#8dbbf3; --accent-soft:#1c2c42; --on-accent:#0b1522;
  --sb:#0d1218; --sb-2:#16202b; --sb-ink:#9fadbb; --sb-hi:#ffffff; --sb-line:#1f2a36;
  --warn:#f2c46b; --warn-bg:#2f2513; --warn-line:#5c4720;
  --ok:#7fcf98; --ok-bg:#16291c; --ok-line:#2b5236;
  --late:#f2958c; --late-bg:#341a18; --late-line:#5e2c27;
  --info-line:#2d4564;
  --fisio:#6ea8ef; --fono:#b48ae6; --nutri:#8ac46a; --psico:#e7889f; --to:#eaa45a;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25;text-wrap:balance}
h1{font-size:18px} h2{font-size:14px} h3{font-size:13.5px}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.muted{color:var(--muted)} .small{font-size:12px} .num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}

/* estrutura */
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.sb{background:var(--sb);color:var(--sb-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
.sb-brand{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--sb-line);color:var(--sb-hi);text-decoration:none}
.sb-brand:hover{text-decoration:none}
.sb-logo{width:30px;height:30px;border-radius:5px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;letter-spacing:.03em;flex:none}
:root[data-theme="dark"] .sb-logo{color:var(--on-accent)}
.sb-brand b{display:block;font-size:13.5px;font-weight:600}
.sb-brand span{display:block;font-size:11px;color:var(--sb-ink)}
.sb-brand{flex-direction:column;align-items:stretch;gap:10px}
.sb-brand .sb-logos{display:flex;align-items:center;justify-content:center;gap:14px;background:#fff;border-radius:6px;padding:8px 10px}
.sb-brand .sb-logos img{height:62px;width:auto;display:block}
.sb-brand .sb-logos .lg-apae{height:52px}
.sb nav{padding:10px 8px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1}
.sb .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#7f90a3;padding:12px 10px 4px}
.sb nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:4px;color:var(--sb-ink);font-size:13px}
.sb nav a:hover{background:var(--sb-2);color:var(--sb-hi);text-decoration:none}
.sb nav a.on{background:var(--sb-2);color:var(--sb-hi);box-shadow:inset 2px 0 0 var(--accent)}
.sb nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.navcount{margin-left:auto;background:#d8432f;color:#fff;border-radius:9px;font-size:10.5px;font-weight:700;padding:0 6px;line-height:17px;min-width:18px;text-align:center}
.sb-user{border-top:1px solid var(--sb-line);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.sb-who{display:flex;gap:10px;align-items:center}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--sb-2);border:1px solid var(--sb-line);color:var(--sb-hi);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.sb-who b{display:block;color:var(--sb-hi);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-who span{display:block;font-size:11px}
.sb-user label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#7f90a3}
.sb-user select{width:100%;background:var(--sb-2);border:1px solid var(--sb-line);color:var(--sb-hi);border-radius:4px;padding:5px 6px;font-size:12px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{display:flex;align-items:center;gap:12px;min-height:48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0;flex:1;overflow:hidden;white-space:nowrap}
.crumb a{color:var(--muted)} .crumb b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:var(--field)}
.envbar{background:var(--warn-bg);border-bottom:1px solid var(--warn-line);color:var(--warn);font-size:12px;padding:5px max(20px,env(safe-area-inset-right,0px)) 5px max(20px,env(safe-area-inset-left,0px))}
.envbar b{font-weight:700;letter-spacing:.03em;text-transform:uppercase;font-size:11px;margin-right:6px}
#app{padding:20px max(20px,env(safe-area-inset-right,0px)) 48px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;max-width:1240px;width:100%}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sb{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .sb-brand{border-bottom:0;padding:10px 8px}
  .sb-brand .t>span{display:none}
  .sb-brand{flex-direction:row;align-items:center}
  .sb-brand .sb-logos{padding:3px 6px;gap:6px}
  .sb-brand .sb-logos img{height:34px}
  .sb-brand .sb-logos .lg-apae{height:30px}
  .sb nav{flex-direction:row;flex-basis:100%;order:3;overflow-x:auto;padding:0 0 8px;gap:2px}
  .sb .grp{display:none}
  .sb nav a{white-space:nowrap}
  .sb-user{border-top:0;margin-left:auto;padding:8px;flex-direction:row;align-items:center}
  .sb-who{display:none}
  .sb-user label{display:none}
  .sb-user select{max-width:170px}
  .topbar{position:static}
}

/* componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--r) var(--r) 0 0}
.panel-h h2{font-size:13px}
.panel-h .cnt{font-weight:400;color:var(--muted);margin-left:4px}
.panel-b{padding:14px}
.panel .tbl-wrap{border:0;border-radius:0}
.pagehead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.pagehead p{margin:2px 0 0;color:var(--muted);font-size:12.5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;border:1px solid var(--field);background:var(--surface);padding:0 12px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:12.5px;color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--late);border-color:var(--late-line)}
.btn.small,.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:3px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent;line-height:17px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.fill,.pill.gov{background:var(--accent-soft);color:var(--accent);border-color:var(--info-line)}
.pill.ready,.pill.wait{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.pill.signed,.pill.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.pill.late{background:var(--late-bg);color:var(--late);border-color:var(--late-line)}
.badge-new{background:var(--accent);color:var(--on-accent);border-radius:9px;font-size:10.5px;padding:0 6px;font-weight:700;line-height:16px;display:inline-block}

.dots{display:inline-flex;gap:3px}
.dot{width:24px;height:18px;border-radius:3px;font-size:9.5px;font-weight:700;display:grid;place-items:center;border:1px solid var(--c);color:var(--c);letter-spacing:.02em}
.dot.done{background:var(--c);color:var(--surface)}
.dot.na{border-style:dashed;color:var(--muted);border-color:var(--line);opacity:.8}
.a-fisio{--c:var(--fisio)}.a-fono{--c:var(--fono)}.a-nutri{--c:var(--nutri)}.a-psico{--c:var(--psico)}.a-to{--c:var(--to)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--c)}
.chip::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.empty{padding:20px 14px;color:var(--muted);font-size:13px;text-align:center}
.card .empty,.stack>.empty{border:1px dashed var(--line);border-radius:var(--r)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.stat{padding:12px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border-top:0;border-bottom:0;border-left:0;cursor:pointer}
.stat:last-child{border-right:0}
.stat:hover{background:var(--surface-2)}
.stat .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted)}
.stat.alert .v{color:var(--late)}
@media (max-width:700px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-size:13px}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr[data-go]{cursor:pointer}
tbody tr[data-go]:hover td{background:var(--accent-soft)}
td .sub{display:block;font-size:12px;color:var(--muted)}
td.act{text-align:right;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.t-abrir{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.tag.t-ass{color:var(--accent);background:var(--accent-soft);border-color:var(--info-line)}
.tag.t-obj{color:var(--ink)}
tr.inline-form td{background:var(--surface-2)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.toolbar input[type=search]{max-width:280px}
.toolbar select{width:auto}

label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:12px;color:var(--muted);min-width:0}
label.f span.hint{font-weight:400;font-size:11.5px}
input[type=text],input[type=date],input[type=search],input[type=password],select,textarea{border:1px solid var(--field);background:var(--surface);border-radius:3px;padding:6px 8px;width:100%;min-width:0;font-size:13px;color:var(--ink);font-weight:400}
input[type=text],input[type=date],input[type=search],input[type=password],select{height:32px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:78px;line-height:1.45}
textarea[readonly]{background:var(--surface-2);border-color:var(--line);cursor:default}
textarea[readonly]:focus{box-shadow:none;border-color:var(--line)}
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 14px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}
@media (max-width:760px){.fgrid{grid-template-columns:1fr}.c2,.c3,.c4,.c6{grid-column:auto}}
.f > span:first-child{font-weight:600}
.seg{display:inline-flex;border:1px solid var(--field);border-radius:3px;overflow:hidden;height:32px}
.seg label{padding:0 14px;cursor:pointer;font-weight:600;font-size:12.5px;border-right:1px solid var(--field);display:flex;align-items:center;color:var(--ink);background:var(--surface)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--on-accent)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.team-row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2)}
.team-row:last-child{border-bottom:0}
@media (max-width:520px){.team-row{grid-template-columns:1fr}}

/* PTS: faixa do paciente + abas */
.banner{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.banner-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px}
.banner-top h1{font-size:17px}
.banner-kv{display:flex;flex-wrap:wrap;border-top:1px solid var(--line-2);background:var(--surface-2)}
.banner-kv div{padding:8px 16px;border-right:1px solid var(--line-2);min-width:0}
.banner-kv div:last-child{border-right:0}
.banner-kv dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.banner-kv dd{margin:0;font-size:13px;font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .cnt{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:0 6px;color:var(--muted);font-weight:600}
.tabs .cnt.new{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.dl dd{margin:3px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.dl .wide{grid-column:1/-1}
@media (max-width:640px){.dl{grid-template-columns:1fr 1fr}}

.area{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.area-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--r) var(--r) 0 0}
.area-h h3{display:inline-flex;align-items:center;gap:8px;font-size:13.5px}
.area-h h3::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.area-h .small{margin-left:18px}
.area-b{padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.area-b{grid-template-columns:1fr}}
.area-f{padding:0 14px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.area.na .area-b{display:block;color:var(--muted);font-style:italic}
.area.na .area-h h3::before{background:var(--line)}
.lock{font-size:12px;color:var(--muted)}

.callout{border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1px solid;font-size:13px}
.callout.ready{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.callout.signed{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.callout.late{background:var(--late-bg);color:var(--late);border-color:var(--late-line)}
.callout.info{background:var(--accent-soft);color:var(--ink);border-color:var(--info-line)}
.callout b{color:inherit}
.callout .btn{color:var(--ink)}
.callout .btn.primary{color:var(--on-accent)}

.chat{display:flex;flex-direction:column;max-width:860px}
.msgs{overflow-y:auto;display:flex;flex-direction:column;gap:0;max-height:min(60vh,560px)}
.msg{padding:10px 14px;border-bottom:1px solid var(--line-2)}
.msg.mine{background:var(--surface-2)}
.msg .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:2px;flex-wrap:wrap}
.msg .meta b{color:var(--ink);font-weight:600}
.msg p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.composer{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.composer textarea{min-height:56px}
details.hist summary{cursor:pointer;font-weight:600}
details.hist ol{margin:10px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

.toast{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#1d2733;color:#fff;padding:10px 14px;border-radius:4px;font-size:13px;z-index:20;max-width:min(420px,calc(100% - 32px));box-shadow:0 4px 14px rgba(0,0,0,.18)}

.req{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.req .msgq{background:var(--surface-2);border:1px solid var(--line-2);border-radius:3px;padding:8px 10px;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}

/* Assinatura eletrônica */
.signpanel{margin:0 14px 14px;border:1px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.signpanel .decl{font-size:12.5px;margin:0}
.pad-wrap{position:relative;max-width:480px}
.pad{display:block;width:100%;aspect-ratio:3/1;background:var(--paper);border:1px solid var(--field);border-radius:3px;touch-action:none;cursor:crosshair}
.pad-base{position:absolute;left:8%;right:8%;bottom:24%;border-top:1px dashed var(--paper-line);pointer-events:none}
.typed{font-family:"Caveat",cursive;font-size:2.4rem;color:#0d2a57;background:var(--paper);border:1px solid var(--field);border-radius:3px;max-width:480px;aspect-ratio:3/1;display:grid;place-items:center;line-height:1}
.pin{max-width:140px;letter-spacing:.3em;font-variant-numeric:tabular-nums}
.sigline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12px;color:var(--ok)}
.sigline img,.sigline .typed-mini{height:32px;background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:2px 6px}
.typed-mini{font-family:"Caveat",cursive;font-size:1.3rem;color:#0d2a57;display:inline-flex;align-items:center}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;letter-spacing:.04em}
.verify-res{border-radius:var(--r);padding:12px 14px}

/* Assinaturas gov.br */
.govlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r)}
.govlist li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line-2)}
.govlist li:last-child{border-bottom:0}
.govlist .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11px;border:1.5px solid var(--field);color:var(--muted)}
.govlist li.done .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.govlist .st{font-size:12px;color:var(--muted);text-align:right}
.govlist li.done .st{color:var(--ok)}
@media (max-width:520px){.govlist li{grid-template-columns:28px minmax(0,1fr)}.govlist .st{grid-column:2;text-align:left}}
.govturn{border:1px solid var(--accent);border-radius:var(--r);padding:14px;background:var(--accent-soft);display:flex;flex-direction:column;gap:12px}
.govturn ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:12px}
.govturn li p{margin:2px 0 6px;font-size:12.5px;color:var(--muted)}

/* Folha (pré-visualização da ficha) — sempre clara, como papel */
.sheet-wrap{overflow-x:auto;padding:8px 0;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r)}
.sheet .logos{position:relative;height:0}.sheet .logos img{position:absolute;top:-20px;height:84px}.sheet .logos .la{left:-8px}.sheet .logos .lc{right:-8px}
.sheet{position:relative;width:794px;margin:16px auto;background:var(--paper);color:var(--paper-ink);padding:44px 52px;box-shadow:0 1px 3px rgba(0,0,0,.15);font-family:Arial,Helvetica,sans-serif;font-size:12.5px;line-height:1.35}
.sheet .inst{text-align:center;font-style:italic;font-weight:700;font-size:15px}
.sheet .ttl{text-align:center;font-weight:700;font-size:15px;margin:12px 0 6px;letter-spacing:.02em}
.sheet .fl{display:flex;gap:6px;margin-top:7px;align-items:baseline}
.sheet .fl .lb{white-space:nowrap}
.sheet .fl .v{flex:1;border-bottom:1px solid var(--paper-line);min-height:17px;white-space:pre-wrap;overflow-wrap:anywhere;color:#0d2a57}
.sheet .bx{display:inline-block;width:12px;height:12px;border:1px solid var(--paper-ink);vertical-align:-2px;margin:0 4px 0 8px;text-align:center;line-height:11px;font-size:11px;font-weight:700}
.sheet .sec{margin-top:16px}
.sheet table.sig{width:100%;min-width:0;border-collapse:collapse;margin-top:18px;table-layout:fixed}
.sheet table.sig td{border:1px solid var(--paper-ink);height:92px;vertical-align:top;padding:5px;font-size:12px;background:transparent;color:var(--paper-ink)}
.sheet table.sig .simg{display:block;height:34px;margin-top:4px;max-width:100%}
.sheet table.sig .styped{display:block;font-family:"Caveat",cursive;font-size:20px;color:#0d2a57;height:34px;margin-top:4px;line-height:34px;white-space:nowrap;overflow:hidden}
.sheet table.sig .stamp{display:block;font-size:8px;color:#0d2a57}
.sheet table.sig .who{display:block;margin-top:4px;font-size:10px;color:#0d2a57}
.sheet .foot{font-size:10.5px;font-weight:700;margin-top:6px}
.sheet .signs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:30px;align-items:end;text-align:center}
.sheet .signs .ln{border-top:1px solid var(--paper-ink);padding-top:3px}
.sheet .signs .rs{display:flex;flex-direction:column;align-items:center;gap:0}
.sheet .signs .rs img{height:34px}
.sheet .signs .rs .styped{font-family:"Caveat",cursive;font-size:20px;color:#0d2a57;line-height:34px}
.sheet .signs .rs .stamp{font-size:8px;color:#0d2a57}
.sheet .signs .dt{text-align:left}

/* Diagnóstico ampliado */
.sugs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.sugs{grid-template-columns:1fr}}
.sugcol{border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.sugh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.sug{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line-2);font-size:12.5px}
.sug .sub{display:block;font-size:11.5px;color:var(--muted)}
.sugcol>.btn{margin:6px 8px;align-self:flex-start}
.drawing{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:8px;text-align:center}
.drawing svg{max-width:none;display:inline-block}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.leg span{display:inline-flex;align-items:center;gap:6px}
table.edt td{padding:5px 8px}
table.edt input[type=text],table.edt select{height:30px}
table.edt .ck,th.ck{text-align:center;width:74px}
table.edt input[type=checkbox]{width:16px;height:16px}
@media (prefers-reduced-motion:no-preference){.btn,.sb nav a,tbody tr td{transition:background-color .12s}}
</style>

async function sha(str){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h1=0x811c9dc5,h2=0x01000193;for(let i=0;i<str.length;i++){h1=Math.imul(h1^str.charCodeAt(i),16777619);h2=Math.imul(h2+str.charCodeAt(i),2246822519)}return ((h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0')).repeat(4)}
}

function initPad(){

  let draw=false,last=null;const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.addEventListener('pointerdown',e=>{draw=true;last=pos(e);c.setPointerCapture(e.pointerId);x.beginPath();x.arc(last[0],last[1],2,0,7);x.fillStyle='#0d2a57';x.fill();padDirty=true});

}

function vPTS(p){
  const u=me(), s=status(p), isResp=p.respId===u.id, travado=!!p.assinadoEm;
  const at=ativas(p), ft=feitas(p);
  let call='';
  if(s.k==='gov'){const fz=govFaltam(p),eu=fz.some(x=>x.profId===u.id),tot=govSignatarios(p).length;call=`<div class="callout info"><div><b>Objetivos completos. Cada profissional assina o PDF pelo gov.br, quando puder e em qualquer ordem.</b> ${tot-fz.length} de ${tot} assinaram. Faltam: ${fz.map(x=>esc(prof(x.profId)?.nome||'')+(x.profId===u.id?' (você)':'')).join(', ')}.</div><a class="btn ${eu?'primary':''}" href="#ficha-${p.id}">${eu?'Assinar agora':'Ver assinaturas'}</a></div>`}
  else if(s.k==='ready') call=`<div class="callout ready"><div><b>${GOV()?'Todos assinaram pelo gov.br.':'Todas as áreas preencheram.'}</b> ${isResp?'Gere a ficha, explique ao paciente/responsável e registre a assinatura.':'Aguardando o responsável colher a assinatura.'}</div><div class="row"><a class="btn primary" href="#ficha-${p.id}">Ver ficha para impressão</a></div></div>`;
  else if(s.k==='signed') call=`<div class="callout signed"><div><b>Assinado em ${fmtD(p.assinadoEm)}.</b> Novo PTS previsto para ${fmtD(s.venc)} (12 meses).</div><div class="row"><a class="btn" href="#ficha-${p.id}">Ver ficha</a></div></div>`;
  else if(s.k==='late'&&p.assinadoEm) call=`<div class="callout late"><div><b>12 meses de tratamento completados em ${fmtD(s.venc)}.</b> Faça um novo PTS para continuidade do tratamento.</div><div class="row"><a class="btn" href="#ficha-${p.id}">Ver ficha anterior</a>${isResp?`<button class="btn primary" data-act="renovar" data-id="${p.id}">Abrir novo PTS</button>`:''}</div></div>`;

  const areaCard=a=>{

    return `<article class="area a-${a.k}" id="area-${a.k}">
     <div class="area-h"><div><h3>${a.nome}</h3><div class="small muted">${esc(prof(pid)?.nome||'')}${pid===u.id?' (você)':''}</div></div>${done?`<span class="pill signed">${GOV()?'Concluído':'Assinado'} ${fmtDT(ar.concluidoEm)}</span>`:`<span class="pill fill">Pendente</span>`}</div>
     <div class="area-b">
      <label class="f" for="t-${a.k}-medio">Médio prazo (6 meses)<textarea id="t-${a.k}-medio" data-area="${a.k}" data-campo="medio" ${ro?'readonly':''} placeholder="${ro?'Ainda não preenchido':'Objetivos para os próximos 6 meses'}">${esc(ar.medio)}</textarea></label>
      <label class="f" for="t-${a.k}-longo">Longo prazo (12 meses)<textarea id="t-${a.k}-longo" data-area="${a.k}" data-campo="longo" ${ro?'readonly':''} placeholder="${ro?'Ainda não preenchido':'Objetivos para 12 meses'}">${esc(ar.longo)}</textarea></label>
     </div>
     ${!GOV()&&done&&ar.assinatura?`<div class="area-f" style="justify-content:flex-start"><div class="sigline">${sigMini(ar.assinatura)}<span>${esc(sigStamp(ar.assinatura))}</span></div></div>`:''}
     ${emAss?signPanel(p,a.k):`<div class="area-f"><span class="lock" id="st-${a.k}">${pode?(done?(GOV()?'Concluído. Para editar, reabra'+(govIniciado(p)?' (as assinaturas gov.br serão reiniciadas).':'.'):'Assinado. Para editar, reabra (a assinatura será anulada).'):(ar.atualizadoEm?'Rascunho salvo '+fmtDT(ar.atualizadoEm):'Salva automaticamente enquanto você digita.')):(travado?'PTS assinado: objetivos travados.':'Só '+esc(prof(pid)?.nome||'')+' pode editar esta área.')}</span>
      ${pode?(done?`<button class="btn" data-act="reabrir" data-area="${a.k}">Reabrir para editar</button>`:(GOV()?`<button class="btn primary" data-act="concluir" data-area="${a.k}">Concluir minha parte</button>`:`<button class="btn primary" data-act="abrir-assinar" data-area="${a.k}">Concluir e assinar</button>`)):''}</div>`}
    </article>`;
  };
  const podeFalar=naEquipe(p,u.id);
  if(ptsTab.id!==p.id)ptsTab={id:p.id,tab:'objetivos'};
  const tab=ptsTab.tab, nl=naoLidas(p);
  const msgs=p.mensagens.map(m=>{const au=prof(m.autorId);return `<div class="msg ${m.autorId===u.id?'mine':''}"><div class="meta"><b>${esc(au?.nome||'Profissional removido')}</b>${au?`<span class="chip a-${au.area}">${AREA[au.area].nome}</span>`:''}<span>${fmtD(m.em)} ${fmtDT(m.em).split(' às ')[1]}</span></div><p>${esc(m.texto)}</p></div>`}).join('');
  if(tab==='discussao')setTimeout(()=>{marcarLido(p);const b=$('#msgs');if(b)b.scrollTop=b.scrollHeight},0);
  const sn=v=>v==='sim'?'Sim':v==='nao'?'Não':'—';
  let pane='';
  if(tab==='objetivos')pane=`<div class="stack">${AREAS.map(areaCard).join('')}</div>`;
  else if(tab==='discussao')pane=`<section class="panel chat"><div class="panel-h"><h2>Discussão do caso</h2><span class="small muted">${p.mensagens.length} mensage${p.mensagens.length===1?'m':'ns'}</span></div>
     <div class="msgs" id="msgs">${msgs||'<div class="empty">Nenhuma mensagem. Use este espaço para alinhar condutas com a equipe.</div>'}</div>
     ${podeFalar?`<form class="composer" id="form-msg" data-id="${p.id}"><label class="f" for="msg-txt">Nova mensagem para a equipe<textarea id="msg-txt" placeholder="Ex.: A família relatou piora do sono…"></textarea></label><div class="row" style="justify-content:space-between"><span class="small muted">Enter envia · Shift+Enter quebra linha</span><button class="btn primary" type="submit">Enviar</button></div></form>`:`<div class="composer small muted">Só a equipe deste PTS pode escrever aqui.</div>`}
    </section>`;
  else if(tab==='diag')pane=vDiag(p);
  else if(tab==='plano')pane=vPlano(p);
  else if(tab==='dados')pane=`<section class="panel"><div class="panel-h"><h2>Dados do PTS</h2>${isResp&&!travado?`<a class="btn sm" href="#editar-${p.id}">Editar</a>`:''}</div><div class="panel-b"><dl class="dl">
      <div class="wide"><dt>Hipótese diagnóstica</dt><dd>${esc(p.hipotese)||'—'}</dd></div>
      <div class="wide"><dt>Objetivos manifestados pelo paciente</dt><dd>${esc(p.objPaciente)||'—'}</dd></div>
      <div><dt>Encaminhamento para Therasuit</dt><dd>${sn(p.therasuit)}</dd></div>
      <div><dt>Encaminhamento para Fisioterapia Aquática</dt><dd>${sn(p.aquatica)}</dd></div>
      <div><dt>Frequenta ensino regular</dt><dd>${sn(p.ensino)}</dd></div>
      <div><dt>Aberto em</dt><dd class="num">${fmtD(p.criadoEm)}</dd></div>
      <div><dt>Prazo de preenchimento</dt><dd class="num">${fmtD(p.prazo)||'—'}</dd></div>
      <div><dt>Responsável</dt><dd>${esc(prof(p.respId)?.nome||'—')}</dd></div>
    </dl></div></section>
    ${isResp&&!travado?`<section class="panel"><div class="panel-h"><h2>Excluir PTS</h2></div><div class="panel-b row" style="justify-content:space-between"><span class="small muted">Apaga o PTS, os objetivos e a conversa. Não dá para desfazer.</span><button class="btn danger" data-act="excluir" data-id="${p.id}">Excluir este PTS</button></div></section>`:''}`;
  else pane=`<section class="panel"><div class="panel-h"><h2>Histórico</h2></div><div class="tbl-wrap"><table style="min-width:0"><thead><tr><th style="width:150px">Data</th><th>Evento</th></tr></thead><tbody>${[...p.historico].reverse().map(h=>`<tr><td class="num">${fmtD(h.em)} ${fmtDT(h.em).split(' às ')[1]}</td><td>${esc(h.texto)}</td></tr>`).join('')}</tbody></table></div></section>`;
  const T=(k,t,c,cls)=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" data-act="tab" data-tab="${k}">${t}${c!=null?`<span class="cnt ${cls||''}">${c}</span>`:''}</button>`;
  const destaque=s.k==='ready'||s.k==='gov';
  return `
  <section class="banner">
   <div class="banner-top"><div style="min-width:0"><div class="row"><h1>${esc(p.nome)}</h1>${pill(p)}</div><div class="small muted" style="margin-top:2px">${esc(p.hipotese||'Projeto Terapêutico Singular')}</div></div>
    <div class="row">${isResp&&!travado?`<a class="btn" href="#editar-${p.id}">Editar dados e equipe</a>`:''}<button class="btn" data-dx="pdf">Folha complementar</button><a class="btn ${destaque?'primary':''}" href="#ficha-${p.id}">Ficha e assinaturas</a></div></div>
   <dl class="banner-kv">
    <div><dt>Prontuário</dt><dd class="num">${esc(p.prontuario)||'—'}</dd></div>
    <div><dt>Nascimento</dt><dd class="num">${fmtD(p.nasc)||'—'}</dd></div>
    <div><dt>Idade</dt><dd>${esc(idade(p.nasc))||'—'}</dd></div>
    <div><dt>Responsável</dt><dd>${esc(prof(p.respId)?.nome||'—')}</dd></div>
    <div><dt>Áreas</dt><dd>${dots(p)}</dd></div>
    <div><dt>${p.assinadoEm?'Renovação':'Prazo'}</dt><dd class="num">${p.assinadoEm?fmtD(s.venc):(fmtD(p.prazo)||'—')}</dd></div>
   </dl>
  </section>
  ${call}
  <div class="tabs" role="tablist">${T('objetivos','Objetivos',ft.length+'/'+at.length)}${T('diag','Diagnóstico ampliado')}${T('plano','Plano de ações',(p.plano||[]).length)}${T('discussao','Discussão',nl?nl+' nova'+(nl>1?'s':''):p.mensagens.length,nl?'new':'')}${T('dados','Dados do PTS')}${T('historico','Histórico',p.historico.length)}</div>
  ${pane}`;
}

function fichaHTML(p){
  const resp=prof(p.respId);
  const v=t=>`<span class="v">${esc(t)}</span>`;
  const bx=on=>`<span class="bx">${on?'X':''}</span>`;
  const obj=(k,campo)=>p.equipe[k]?(p.areas[k]?.[campo]||''):'Não se aplica';
  const sec=(t,campo)=>`<div class="sec"><div>Objetivos em <b>${t}</b></div>${AREAS.map(a=>`<div class="fl"><span class="lb">${a.form}</span>${v(obj(a.k,campo))}</div>`).join('')}</div>`;
  return `<div class="sheet" aria-label="Pré-visualização da ficha"><div class="logos"><img class="la" src="${LOGO_APAE}" alt="APAE Campo Grande"><img class="lc" src="${LOGO_CER}" alt="CER"></div>
   <div class="inst">${esc(S.inst1)}</div><div class="inst">${esc(S.inst2)}</div>
   <div class="ttl">PROJETO TERAPEUTICO SINGULAR - PTS</div>
   <div class="fl" style="justify-content:flex-end"><span class="lb">Prontuário:</span><span class="v" style="flex:0 0 150px">${esc(p.prontuario)}</span></div>
   <div class="fl"><span class="lb">Nome do Paciente:</span>${v(p.nome)}</div>
   <div class="fl"><span class="lb">Data de Nascimento:</span><span class="v" style="flex:0 0 120px">${fmtD(p.nasc)}</span><span class="lb">Idade:</span>${v(idade(p.nasc))}</div>
   <div class="fl"><span class="lb">Frequenta ensino regular:</span>${bx(p.ensino==='sim')}Sim ${bx(p.ensino==='nao')}Não</div>
   <div class="fl"><span class="lb">Hipótese Diagnóstica:</span>${v(p.hipotese)}</div>
   <div class="fl"><span class="lb"><b>Profissional Responsável pelo PTS:</b></span>${v(resp?resp.nome+' – '+AREA[resp.area].nome:'')}</div>
   <div class="fl"><span class="lb">Objetivos manifestados pelo paciente:</span>${v(p.objPaciente)}</div>
   <div class="sec"><div>Encaminhamento para Therasuit ${bx(p.therasuit==='sim')}Sim ${bx(p.therasuit==='nao')}Não</div><div style="margin-top:4px">Encaminhamento para Fisioterapia Aquática ${bx(p.aquatica==='sim')}Sim ${bx(p.aquatica==='nao')}Não</div></div>
   ${sec('MÉDIO PRAZO','medio').replace('</b>','</b> (6 meses)')}
   ${sec('LONGO PRAZO','longo').replace('</b>','</b> (12 meses)')}
   <table class="sig"><tr>${SIG_ORDER.map(k=>{const pr=prof(p.equipe[k]);return `<td>${AREA[k].sig}${(()=>{const ga=GOV()&&p.equipe[k]&&p.gov?.ass?.[p.equipe[k]];if(ga)return `<span class="simg"></span><span class="stamp" style="color:#22693f;font-weight:700">Assinado digitalmente via gov.br em ${fmtD(ga.em)}</span>`;const sg=!GOV()&&p.equipe[k]&&p.areas[k]?.assinatura;return sg?(sg.img?`<img class="simg" src="${sg.img}" alt="">`:`<span class="styped">${esc(sg.nome)}</span>`)+`<span class="stamp">Ass. eletrônica ${fmtD(sg.em)} · ${sg.codigo}</span>`:`<span class="simg"></span><span class="stamp">&nbsp;</span>`})()}${pr?`<span class="who">${esc(pr.nome)}<br>${esc(pr.registro)}</span>`:''}</td>`}).join('')}</tr></table>
   <div class="foot">•&nbsp; APÓS 12 MESES DE TRATAMENTO FAZER NOVO PTS PARA CONTINUIDADE DO TRATAMENTO</div>
   <div class="signs"><div class="dt">Data Explicação: <span style="border-bottom:1px solid var(--paper-line);display:inline-block;min-width:80px;color:#0d2a57">${fmtD(p.dataExplicacao)}</span></div><div class="rs">${GOV()&&p.gov?.ass?.[p.respId]?`<span class="stamp" style="color:#22693f;font-weight:700">Assinado digitalmente via gov.br em ${fmtD(p.gov.ass[p.respId].em)}</span>`:''}${!GOV()&&p.assResp?(p.assResp.img?`<img src="${p.assResp.img}" alt="">`:`<span class="styped">${esc(p.assResp.nome)}</span>`)+`<span class="stamp">${esc(p.assResp.nome)} · ${esc(p.assResp.registro)} · Cód. ${p.assResp.codigo}</span>`:''}<div class="ln" style="width:100%">Assinatura e Carimbo</div></div><div class="ln">Paciente ou Responsável</div></div>
  </div>`;
}

function vFicha(p){return GOV()?vFichaGov(p):vFichaSite(p)}
function vFichaGov(p){
  const u=me(), isResp=p.respId===u.id, s=status(p);
  const pend=ativas(p).length-feitas(p).length;
  const sigs=govSignatarios(p), ass=govAss(p), completo=govCompleto(p);
  const feitos=sigs.filter(x=>ass[x.profId]).length;
  const meu=sigs.find(x=>x.profId===u.id), jaAssinei=meu&&ass[u.id];
  const podeAssinar=!pend&&meu&&!jaAssinei&&!p.assinadoEm;
  const versao=p.gov?.base?.versao;
  const lista=sigs.map(f=>{const a=ass[f.profId];const pr=prof(f.profId);const cls=a?'done':'';
    return `<li class="${cls}"><span class="n" aria-hidden="true">${a?'✓':''}</span><div style="min-width:0"><b>${esc(pr?.nome||'Profissional removido')}</b>${f.profId===u.id?' <span class="muted">(você)</span>':''}<div class="small muted">${esc(f.papel)}${pr?.registro?' · '+esc(pr.registro):''}</div></div>
     <span class="st">${a?'Assinou '+fmtDT(a.em)+(a.simulado?' (simulação)':''):'Pendente'}${a&&a.arquivoId&&(isResp||f.profId===u.id)?`<br><button class="btn ghost small" data-act="gov-arq" data-prof="${f.profId}" data-id="${p.id}">Baixar arquivo assinado</button>`:''}</span></li>`}).join('');
  const turno=podeAssinar?`<div class="govturn" id="govturn"><h3>Sua assinatura${meu?' · '+esc(meu.papel):''}</h3>
    <ol>
     <li><b>Baixe o PDF para assinatura</b><p>É o mesmo arquivo para toda a equipe${versao?' (versão '+versao+')':''}. Não precisa esperar ninguém.</p><button class="btn" data-act="gov-baixar" data-id="${p.id}">Baixar PDF</button></li>
     <li><b>Assine no gov.br</b><p>No assinador, entre com sua conta gov.br (nível prata ou ouro), envie o PDF, posicione a assinatura no seu quadro da ficha e baixe o arquivo assinado.</p><a class="btn" href="${ASSINADOR}" target="_blank" rel="noopener">Abrir o assinador gov.br ↗</a></li>
     <li><b>Envie o PDF assinado</b><p>O site confere se é a versão certa deste PTS e se tem assinatura digital.</p><label class="btn primary" for="gov-file">Enviar PDF assinado<input type="file" id="gov-file" data-id="${p.id}" accept="application/pdf,.pdf" hidden></label></li>
    </ol>
    <p class="small" id="gov-err" style="color:var(--late);font-weight:700;margin:0" hidden></p>
    <div class="row" style="border-top:1px dashed var(--line);padding-top:10px"><span class="small muted">Apresentando o protótipo sem conta gov.br?</span><button class="btn ghost small" data-act="gov-simular" data-id="${p.id}">Simular minha assinatura</button></div>
   </div>`:'';
  return `
  <div><a href="#pts-${p.id}" class="small">← Voltar ao PTS</a><div class="eyebrow" style="margin-top:8px">Ficha e assinaturas</div><h1>${esc(p.nome)}</h1></div>
  ${pend?`<div class="callout late"><div><b>Ainda faltam ${pend} área${pend>1?'s':''} concluir os objetivos.</b> As assinaturas pelo gov.br começam quando todas terminarem, porque todos assinam a ficha completa.</div></div>`:''}
  <section class="card stack">
   <div class="spread"><div style="min-width:0"><h2>1. Assinaturas da equipe pelo gov.br</h2><p class="small muted" style="margin:4px 0 0">Cada um assina quando puder, em qualquer ordem. O site guarda o arquivo assinado de cada profissional.</p></div><span class="pill ${completo?'signed':'gov'}">${feitos} de ${sigs.length}</span></div>
   ${!pend&&!meu?`<p class="small muted" style="margin:0">Você não está na equipe deste PTS.</p>`:''}
   ${turno}
   ${jaAssinei&&!completo?`<p class="small" style="margin:0;color:var(--ok);font-weight:700">Você já assinou. Faltam ${sigs.length-feitos}.</p>`:''}
   <ul class="govlist">${lista}</ul>
   ${completo?`<div class="callout signed"><div><b>Todos assinaram.</b> Os arquivos assinados ficam guardados no PTS e podem ser conferidos no <a href="${VALIDADOR}" target="_blank" rel="noopener">Validador do ITI ↗</a>.</div>${isResp?`<button class="btn primary" data-act="gov-final" data-id="${p.id}">Baixar ficha para impressão</button>`:''}</div>`:''}
  </section>
  <section class="card stack">
   <div class="spread"><div style="min-width:0"><h2>2. Assinatura do paciente ou responsável</h2><p class="small muted" style="margin:4px 0 0">${p.assinadoEm?'Assinatura registrada em '+fmtD(p.assinadoEm)+'.':completo?(isResp?'Imprima a ficha (ela sai com a indicação de quem assinou pelo gov.br), explique o PTS e colha a assinatura. Depois registre aqui. Os objetivos ficam travados.':'O responsável pelo PTS colhe e registra a assinatura.'):'Disponível depois que toda a equipe assinar.'}</p></div>
    ${isResp&&!p.assinadoEm?`<div class="row"><label class="f" for="f-dtexp">Data da explicação<input type="date" id="f-dtexp" value="${esc(p.dataExplicacao||todayStr())}"></label><button class="btn" data-act="assinar" data-id="${p.id}" style="align-self:flex-end" ${completo?'':'disabled'}>Registrar assinatura</button></div>`:''}
    ${isResp&&p.assinadoEm&&s.k!=='late'?`<button class="btn ghost small" data-act="desfazer-assinatura" data-id="${p.id}">Desfazer registro</button>`:''}
   </div>
  </section>
  <h2>Pré-visualização da ficha</h2>
  <div class="sheet-wrap">${fichaHTML(p)}</div>`;
}
function vFichaSite(p){

  ${pend?`<div class="callout late"><div><b>Ainda faltam ${pend} área${pend>1?'s':''}.</b> A ficha pode ser gerada, mas sairá incompleta.</div></div>`:''}

   ${emAss?`<div style="margin:0 -16px">${signPanel(p,'resp')}</div>`:''}

async function verificar(cod){
  cod=cod.trim().toUpperCase().replace(/[^A-F0-9]/g,'');if(cod.length===8)cod=cod.slice(0,4)+'-'+cod.slice(4);
  for(const p of S.pts){
    const cands=AREAS.filter(a=>p.areas[a.k]?.assinatura).map(a=>({k:a.k,sig:p.areas[a.k].assinatura})).concat(p.assResp?[{k:'resp',sig:p.assResp}]:[]);
    for(const c of cands){if(c.sig.codigo!==cod)continue;
      const h=await sha(c.k==='resp'?payloadResp(p,c.sig):payloadArea(p,c.k,c.sig));const ok=h===c.sig.hash;
      return `<div class="verify-res callout ${ok?'signed':'late'}" style="display:block"><b>${ok?'Assinatura válida. O conteúdo não foi alterado.':'Atenção: o conteúdo foi alterado depois da assinatura.'}</b>
       <dl class="dl" style="margin-top:10px;color:var(--ink)"><div><dt>Assinado por</dt><dd>${esc(c.sig.nome)}</dd></div><div><dt>Registro</dt><dd>${esc(c.sig.registro||'—')}</dd></div><div><dt>Data e hora</dt><dd>${fmtD(c.sig.em)} ${fmtDT(c.sig.em).split(' às ')[1]}</dd></div>
       <div><dt>Paciente</dt><dd>${esc(p.nome)}</dd></div><div><dt>Prontuário</dt><dd>${esc(p.prontuario)}</dd></div><div><dt>O que assinou</dt><dd>${c.k==='resp'?'PTS como responsável':'Objetivos de '+AREA[c.k].nome}</dd></div></dl>
       <p class="small" style="margin:10px 0 0"><a href="#pts-${p.id}">Abrir o PTS</a></p></div>`}
  }
  return `<div class="callout late" style="display:block"><b>Nenhuma assinatura encontrada com o código ${esc(cod)}.</b> Confira se digitou igual ao impresso na ficha. Uma assinatura anulada (área reaberta para edição) deixa de existir.</div>`;
}

  if(act==='ped-enc-cancelar'){encaminhando=null;render();return}
  if(act==='ped-cobrar'){const x=pedById(b.dataset.id);x.cobrancas=x.cobrancas||[];x.cobrancas.push(nowISO());x.historico.push({em:nowISO(),texto:me().nome+' cobrou a abertura'});save(true);render();toast('Cobrança registrada. Aparece no painel de '+(prof(x.destinoId)?.nome||'')+'. Se quiser, copie a mensagem para o WhatsApp.');return}

  if(act==='ped-cancelar'){if(b.dataset.ok){S.pedidos=S.pedidos.filter(x=>x.id!==b.dataset.id);save(true);render();toast('Pedido cancelado.')}else{b.dataset.ok='1';b.textContent='Clique de novo para cancelar'}return}
  if(act==='gov-baixar'){const blob=await govBase(p);render();if(blob)await salvarArquivo(baseNome(p)+'_para_assinar_'+p.gov.base.versao+'.pdf',blob);return}

  if(act==='gov-arq'){const a=govAss(p)[b.dataset.prof];const blob=await fget(a?.arquivoId);if(!blob){toast('Este arquivo foi enviado em outro computador. Na versão com servidor ele estaria disponível para todos.');return}await salvarArquivo(baseNome(p)+'_assinado_'+slug(prof(b.dataset.prof)?.nome||'')+'.pdf',blob);return}
  if(act==='gov-simular'){govAss(p)[S.currentUser]={em:nowISO(),simulado:true};hist(p,'Assinatura gov.br de '+me().nome+' simulada (demonstração)');save(true);render();toast(govCompleto(p)?'Todos assinaram. O PTS está pronto para o paciente.':'Assinatura simulada. Faltam '+govFaltam(p).length+'.');return}
  if(act==='anular-resp'){p.assResp=null;hist(p,'Assinatura do responsável anulada');save(true);render()}
  if(act==='concluir'){const ar=p.areas[b.dataset.area];if(!ar.medio.trim()||!ar.longo.trim()){toast('Preencha médio e longo prazo antes de concluir.');return}ar.concluidoEm=nowISO();hist(p,AREA[b.dataset.area].nome+' concluiu os objetivos');save(true);render();toast(ativas(p).length===feitas(p).length?'Concluído. Todas as áreas preencheram, o PTS está pronto para assinatura.':'Sua parte foi concluída.')}

  if(act==='rm-prof'){const id=b.dataset.id;const uso=S.pts.filter(x=>x.respId===id||AREAS.some(a=>x.equipe[a.k]===id));if(uso.length){toast('Não dá para remover: está em '+uso.length+' PTS. Troque-o na equipe desses PTS antes.');return}if(S.profs.length<=1){toast('Mantenha ao menos um profissional.');return}S.profs=S.profs.filter(x=>x.id!==id);save(true);render()}
  if(act==='exportar'){const data=JSON.stringify(S,null,2);const fn='pts-backup-'+todayStr()+'.json';await salvarArquivo(fn,new Blob([data],{type:'application/json'}))}
  if(act==='reset'){if(b.dataset.ok){const cu=S.currentUser;S=seed();save(true);location.reload()}else{b.dataset.ok='1';b.textContent='Clique de novo: apaga tudo e volta aos exemplos'}}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='flt-st'){aplicarFiltro();return}
  if(e.target.name==='cfg-metodo'){S.metodoAss=e.target.value;signing=null;save(true);render();toast(GOV()?'Assinatura pelo gov.br ativada.':'Assinatura no próprio site ativada.');return}
  if(e.target.id==='gov-file'){const p=ptsById(e.target.dataset.id),f=e.target.files[0];if(!f||!p)return;const err=$('#gov-err'),fail=t=>{err.textContent=t;err.hidden=false;e.target.value=''};
    let txt;try{const buf=await f.arrayBuffer();txt=new TextDecoder('latin1').decode(new Uint8Array(buf))}catch(x){return fail('Não foi possível ler o arquivo.')}
    if(!txt.startsWith('%PDF'))return fail('Este arquivo não é um PDF.');
    const ver=p.gov?.base?.versao;if(!ver||!txt.includes('PTS-VERSAO-'+ver))return fail('Este PDF não é a versão para assinatura deste PTS. Baixe o PDF no passo 1 e assine esse arquivo.');
    const n=(txt.match(/\/ByteRange\s*\[/g)||[]).length;
    if(!n)return fail('Este PDF ainda não tem assinatura digital. Assine no gov.br e envie o arquivo que você baixou de lá.');
    const id='f'+uid();await fput(id,f);govAss(p)[S.currentUser]={em:nowISO(),arquivoId:id,nome:f.name,nSig:n};
    hist(p,me().nome+' assinou pelo gov.br');save(true);render();toast(govCompleto(p)?'Todos assinaram. O PTS está pronto para o paciente.':'Assinatura recebida. Faltam '+govFaltam(p).length+'.');return}
  if(e.target.name==='sig-modo'&&signing){signing.modo=e.target.value;render();return}
  if(e.target.id==='user-select'){signing=null;encaminhando=null;S.currentUser=e.target.value;save(true);render();toast('Agora você está vendo como '+me().nome+'.')}
  if(e.target.id==='f-nasc'){$('#f-idade').textContent=idade(e.target.value)||'—'}
  if(e.target.id==='imp-file'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.profs)||!Array.isArray(d.pts))throw 0;S=d;S.lidos=S.lidos||{};S.pedidos=S.pedidos||[];S.flags=S.flags||{ex4:true,ped1:true};S.metodoAss=S.metodoAss||'govbr';save(true);render();toast('Backup importado.')}catch(err){toast('Arquivo inválido. Use um backup exportado por este site.')}};r.readAsText(f)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.area){const p=ptsById(route().slice(4));if(!p)return;const ar=p.areas[t.dataset.area];ar[t.dataset.campo]=t.value;ar.atualizadoEm=nowISO();save();const st=$('#st-'+t.dataset.area);if(st)st.textContent='Rascunho salvo '+fmtDT(ar.atualizadoEm)}
  if(t.dataset.cfg){S[t.dataset.cfg]=t.value;save()}
  if(t.id==='flt-q')aplicarFiltro();
});
document.addEventListener('keydown',e=>{if(e.target.id==='msg-txt'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#form-msg').requestSubmit()}});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='form-pedido'){const nome=$('#pd-nome').value.trim(),pr=$('#pd-pront').value.trim(),err=$('#pd-err');
    if(!nome){err.textContent='Informe o nome do paciente.';err.hidden=false;return}
    const ex=ptsDoProntuario(pr);if(ex&&!f.dataset.forcar){const av=$('#pd-aviso');av.innerHTML='Já existe um PTS ativo para o prontuário '+esc(pr)+' ('+esc(ex.nome)+', responsável '+esc(prof(ex.respId)?.nome||'')+'). <a href="#pts-'+ex.id+'">Ver o PTS</a> ou envie de novo para pedir mesmo assim.';av.hidden=false;f.dataset.forcar='1';return}
    const dup=S.pedidos.find(x=>x.status==='aguardando'&&pr&&x.prontuario===pr);if(dup){err.textContent='Já existe um pedido aguardando para este prontuário, feito por '+(prof(dup.solicitanteId)?.nome||'')+'. Use "Cobrar de novo" nele.';err.hidden=false;return}
    const x={id:uid(),nome,prontuario:pr,solicitanteId:S.currentUser,destinoId:$('#pd-para').value,motivo:$('#pd-mot').value.trim(),criadoEm:nowISO(),cobrancas:[],status:'aguardando',historico:[{em:nowISO(),texto:'Pedido feito por '+me().nome}]};
    S.pedidos.push(x);save(true);location.hash='#painel';toast('Pedido enviado para '+(prof(x.destinoId)?.nome||'')+'. Ele aparece no painel da pessoa.');return}
  if(f.id==='form-encaminhar'){const x=pedById(f.dataset.id);const novo=$('#enc-para').value,mot=$('#enc-mot').value.trim();const ant=prof(x.destinoId)?.nome||'';x.destinoId=novo;x.historico.push({em:nowISO(),texto:ant+' encaminhou para '+(prof(novo)?.nome||'')+(mot?': '+mot:'')});if(mot)x.motivo=(x.motivo?x.motivo+'\n\n':'')+'Encaminhado por '+ant+': '+mot;encaminhando=null;save(true);render();toast('Pedido encaminhado para '+(prof(novo)?.nome||'')+'.');return}
  if(f.id==='form-verif'){verificar($('#v-cod').value).then(h=>{verifRes=h;$('#verif-res').innerHTML=h});return}
  if(f.id==='form-msg'){const p=ptsById(f.dataset.id),t=$('#msg-txt').value.trim();if(!t)return;p.mensagens.push({id:uid(),autorId:S.currentUser,texto:t,em:nowISO()});save(true);render();setTimeout(()=>$('#msg-txt')?.focus(),0)}
  if(f.id==='form-prof'){const nome=$('#np-nome').value.trim();if(!nome){const er=$('#np-err');er.textContent='Informe o nome.';er.hidden=false;return}S.profs.push({id:uid(),nome,area:$('#np-area').value,registro:$('#np-reg').value.trim()});save(true);render();toast(nome+' cadastrado(a).')}
  if(f.id==='form-pts'){
    const fd=new FormData(f);const g=k=>(fd.get(k)||'').toString().trim();
    const err=$('#form-err');
    if(!g('nome')){err.textContent='Informe o nome do paciente.';err.hidden=false;$('#f-nome').focus();return}
    const equipe={};AREAS.forEach(a=>equipe[a.k]=g('eq-'+a.k)||null);
    if(!Object.values(equipe).some(Boolean)){err.textContent='Escolha ao menos um profissional para a equipe.';err.hidden=false;return}
    const dados={nome:g('nome'),prontuario:g('prontuario'),nasc:g('nasc'),ensino:g('ensino'),hipotese:g('hipotese'),respId:g('respId'),prazo:g('prazo'),objPaciente:g('objPaciente'),therasuit:g('therasuit'),aquatica:g('aquatica'),equipe};
    let p=f.dataset.id?ptsById(f.dataset.id):null;
    if(p){govReset(p,'dados ou equipe editados');AREAS.forEach(a=>{if(p.equipe[a.k]!==dados.equipe[a.k]&&p.areas[a.k]){p.areas[a.k].assinatura=null;p.areas[a.k].concluidoEm=null}});if(p.assResp){p.assResp=null;hist(p,'Assinatura do responsável anulada por edição dos dados')}Object.assign(p,dados);AREAS.forEach(a=>{p.areas[a.k]=p.areas[a.k]||{medio:'',longo:'',concluidoEm:null,atualizadoEm:null}});hist(p,'Dados/equipe editados por '+me().nome)}
    else{p={id:uid(),...dados,criadoEm:nowISO(),assinadoEm:null,dataExplicacao:'',areas:Object.fromEntries(AREAS.map(a=>[a.k,{medio:'',longo:'',concluidoEm:null,atualizadoEm:null}])),mensagens:[],historico:[]};hist(p,'PTS aberto por '+me().nome);S.pts.push(p);const pd=f.dataset.ped&&pedById(f.dataset.ped);if(pd){pd.status='atendido';pd.ptsId=p.id;pd.respondidoEm=nowISO();pd.historico.push({em:nowISO(),texto:'PTS aberto por '+me().nome});hist(p,'Aberto a pedido de '+(prof(pd.solicitanteId)?.nome||'')+' ('+haDias(pd.criadoEm)+')')}}
    save(true);location.hash='#pts-'+p.id;toast(f.dataset.id?'Alterações salvas.':'PTS aberto. Ele já aparece para cada profissional da equipe.');
  }
});

function ecoSVG(p){

  const W=680,Rr=n>10?230:205,H=2*Rr+150,cx=W/2,cy=H/2,RC=74,RS=50;
  const casa=[p.nome.replace(/^\(Exemplo\)\s*/,'').split(' ')[0]+' (paciente)',...d.familia.filter(f=>f.moraJunto).map(f=>(f.nome||PAR[f.par]||'').split(' ')[0]+' ('+parLabel(f).split(' ')[0]+')')];

    if(r.vinculo==='conflituoso'){const segs=14;let pts=[];for(let k=0;k<=segs;k++){const t=k/segs;const px=x1+(x2-x1)*t,py=y1+(y2-y1)*t;const off=(k%2?1:-1)*(k===0||k===segs?0:5);pts.push((px-off*Math.sin(a)).toFixed(1)+','+(py+off*Math.cos(a)).toFixed(1))}s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="#b42318" stroke-width="1.8"/>`}
    else s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#333" stroke-width="${r.vinculo==='forte'?4.5:r.vinculo==='fraco'?1.6:1.8}" ${r.vinculo==='fraco'?'stroke-dasharray="6 5"':''}/>`;

    s+=`<text x="${sx}" y="${sy-16}" class="t b" fill="${fg}">${esc((r.tipo||'').toUpperCase().slice(0,18))}</text>`;

  });
  if(!n)s+=`<text x="${cx}" y="${cy+RC+40}" class="t" fill="#777">Vincule serviços e pessoas para montar o ecomapa</text>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Ecomapa"><style>.t{font-size:10.5px;text-anchor:middle;fill:#222}.b{font-weight:700;font-size:10px}</style><rect width="100%" height="100%" fill="#ffffff"/>${s}</svg>`;
}

function svgPng(svg){return new Promise(res=>{const m=svg.match(/width="(\d+(?:\.\d+)?)" height="(\d+(?:\.\d+)?)"/);const w=+m[1],h=+m[2];const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=w*2;c.height=h*2;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);try{res({url:c.toDataURL('image/png'),w,h})}catch(e){res(null)}};img.onerror=()=>res(null);img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}
async function gerarFolha(p){
  if(!window.jspdf){toast('O gerador de PDF não carregou. Verifique a conexão e recarregue.');return}

  font('bolditalic',11);ink();doc.text(S.inst1,105,y,{align:'center'});y+=5;doc.text(S.inst2,105,y,{align:'center'});y+=7;
  font('bold',12);doc.text('PROJETO TERAPÊUTICO SINGULAR - PTS',105,y,{align:'center'});y+=5;font('bold',10);doc.text('FOLHA COMPLEMENTAR – DIAGNÓSTICO AMPLIADO E PLANO DE CUIDADOS',105,y,{align:'center'});y+=7;
  const kv=(pairs)=>{let x=M;const lh=5;pairs.forEach(([k,v,w])=>{font('normal',8);gray();doc.text(k.toUpperCase(),x,y);font('bold',9.5);blue();doc.text(doc.splitTextToSize(String(v||'—'),w-2)[0],x,y+4.2);x+=w});ink();y+=lh+5};
  doc.setFillColor(245,247,250);doc.rect(M,y-4,W,22,'F');
  kv([['Paciente',p.nome,92],['Prontuário',p.prontuario,30],['Nascimento',fmtD(p.nasc),30],['Idade',idade(p.nasc),28]]);
  kv([['Responsável pelo PTS',(prof(p.respId)?.nome||'')+(prof(p.respId)?' – '+AREA[prof(p.respId).area].nome:''),92],['Hipótese diagnóstica',p.hipotese,88]]);
  y+=2;
  const sec=(t,need)=>{ensure(need||22);font('bold',10.5);ink();doc.text(t,M,y);doc.setDrawColor(26,95,180);doc.setLineWidth(.5);doc.line(M,y+1.6,M+W,y+1.6);doc.setDrawColor(120);doc.setLineWidth(.2);y+=7};
  const par=(label,txt)=>{font('bold',9);ink();ensure(10);doc.text(label,M,y);y+=4.4;font('normal',9.5);blue();const ls=doc.splitTextToSize(txt&&String(txt).trim()?String(txt):'Não preenchido.',W);ls.forEach(l=>{ensure(5);doc.text(l,M,y);y+=4.5});ink();y+=2.5};
  const table=(cols,rows,opts)=>{const lh=4.2,pad=1.6;const draw=(cells,head)=>{font(head?'bold':'normal',head?8.3:8.8);const wrapped=cells.map((c,i)=>doc.splitTextToSize(String(c??''),cols[i].w-2*pad));const h=Math.max(...wrapped.map(w=>w.length))*lh+2*pad;
      if(y+h>BOT){doc.addPage();y=16;if(!head){draw(cols.map(c=>c.t),true);font('normal',8.8)}}
      let x=M;if(head){doc.setFillColor(238,241,245);doc.rect(M,y,W,h,'F')}
      wrapped.forEach((w,i)=>{head?ink():blue();doc.text(w,x+pad,y+pad+3.1);x+=cols[i].w});doc.rect(M,y,W,h);let xx=M;cols.slice(0,-1).forEach(c=>{xx+=c.w;doc.line(xx,y,xx,y+h)});y+=h;ink()};
    draw(cols.map(c=>c.t),true);if(!rows.length){draw([opts&&opts.vazio||'Nenhum registro.',...cols.slice(1).map(()=>'')],false)}else rows.forEach(r=>draw(r,false));y+=4};
  sec('1. Endereço e contato');
  const e=d.end;table([{t:'Endereço',w:96},{t:'Bairro / região',w:44},{t:'CEP',w:20},{t:'Telefone',w:20}],[[[e.logradouro&&(e.logradouro+(e.numero?', '+e.numero:'')),e.complemento].filter(Boolean).join(' – ')+(e.referencia?' (ref.: '+e.referencia+')':''),[e.bairro,e.regiao||regiaoDoBairro(e.bairro)].filter(Boolean).join(' / '),e.cep||'',e.telefone||'']]);

  const ec=await svgPng(ecoSVG(p));let ew=0,eh=0;if(ec){ew=Math.min(W*0.82,ec.w*0.25);eh=ec.h*ew/ec.w;if(eh>130){eh=130;ew=ec.w*eh/ec.h}}

  font('normal',7.5);gray();doc.text('Linha grossa: vínculo forte · Linha fina: moderado · Tracejada: frágil · Zigue-zague: conflituoso',M,y);y+=6;ink();

  ensure(26);y+=12;doc.line(M+10,y,M+80,y);doc.line(M+100,y,M+170,y);font('normal',9);ink();doc.text('Responsável pelo PTS (assinatura e carimbo)',M+45,y+4.5,{align:'center'});doc.text('Paciente ou responsável',M+135,y+4.5,{align:'center'});
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);font('normal',7);gray();doc.text('Folha complementar do PTS · '+p.nome+' · prontuário '+(p.prontuario||'—')+' · gerado em '+fmtD(todayStr())+' · página '+i+' de '+n,M,292)}
  await salvarArquivo('PTS_'+slug(p.prontuario||'sem-prontuario')+'_'+slug(p.nome)+'_folha_complementar.pdf',doc.output('blob'));
}

let dlP=null;
function downloadsCap(){if(!dlP)dlP=(window.claude&&window.claude.use)?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);return dlP}
async function salvarArquivo(filename,blob){
  const dl=await downloadsCap();
  if(dl){try{await dl.save({filename,data:blob});toast('Arquivo salvo.')}catch(err){if(err&&err.code==='declined')return;toast('Não foi possível salvar o arquivo nesta visualização.')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(err){toast('Não foi possível baixar o arquivo.')}
}
function slug(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,40)}

async function gerarPDF(p,opt){
  if(!window.jspdf){toast('O gerador de PDF não carregou. Verifique a conexão e recarregue.');return}
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const M=16,W=210-2*M,LH=5.5,BOT=286;let y=15;
  opt=opt||{};if(opt.versao)doc.setProperties({title:'PTS '+p.nome,subject:'PTS-VERSAO-'+opt.versao,keywords:'PTS-VERSAO-'+opt.versao,creator:'PTS Compartilhado'});
  const gAss=GOV()&&!opt.base?govAss(p):{};
  const ink=()=>doc.setTextColor(20,20,20), blue=()=>doc.setTextColor(13,42,87);
  const ensure=h=>{if(y+h>BOT){doc.addPage();y=18}};
  const font=(st,sz)=>{doc.setFont('helvetica',st);doc.setFontSize(sz)};
  doc.setDrawColor(110);doc.setLineWidth(.2);
  function wrap(text,firstW,restW){const out=[];const paras=String(text||'').split('\n');paras.forEach(pa=>{const words=pa.split(/\s+/).filter(Boolean);let lim=out.length?restW:firstW;let cur='';if(!words.length){out.push('');return}words.forEach(w=>{const t=cur?cur+' '+w:w;if(!cur||doc.getTextWidth(t)<=lim)cur=t;else{out.push(cur);cur=w;lim=restW}});out.push(cur)});return out.length?out:['']}
  function field(label,value,x,w,minLines,bold){font(bold?'bold':'normal',10);ink();doc.text(label,x,y);const lw=doc.getTextWidth(label)+2;font('normal',10);const lines=wrap(value,w-lw-1,w-1);while(lines.length<(minLines||1))lines.push('');lines.forEach((ln,i)=>{if(i>0){y+=LH;ensure(LH)}const x0=i===0?x+lw:x;blue();doc.text(ln,x0+.5,y);doc.line(x0,y+1.2,x+w,y+1.2)});ink();return lines.length}
  function box(x,label,on){doc.rect(x,y-3.2,3.6,3.6);if(on){font('bold',9);doc.text('X',x+.7,y-.3)}font('normal',10);doc.text(label,x+5,y);return x+5+doc.getTextWidth(label)+5}
  // cabeçalho
  try{doc.addImage(LOGO_APAE,'JPEG',M,6,16.6,22);doc.addImage(LOGO_CER,'JPEG',210-M-22.4,6,22.4,22)}catch(e){}
  font('bolditalic',12.5);ink();doc.text(S.inst1,105,y,{align:'center'});y+=6;doc.text(S.inst2,105,y,{align:'center'});y+=9;
  font('bold',13);doc.text('PROJETO TERAPEUTICO SINGULAR - PTS',105,y,{align:'center'});y+=8;
  field('Prontuário:',p.prontuario,M+W-62,62);y+=LH+1.5;
  field('Nome do Paciente:',p.nome,M,W);y+=LH+.8;
  const ySave=y;field('Data de Nascimento:',fmtD(p.nasc),M,72);y=ySave;field('Idade:',idade(p.nasc),M+78,W-78);y+=LH+.8;
  font('normal',10);doc.text('Frequenta ensino regular:',M,y);let bx=M+doc.getTextWidth('Frequenta ensino regular:')+3;bx=box(bx,'Sim',p.ensino==='sim');box(bx,'Não',p.ensino==='nao');y+=LH+.8;
  field("Hipótese Diagnóstica:",p.hipotese,M,W);y+=LH+.8;
  const r=prof(p.respId);field('Profissional Responsável pelo PTS:',r?r.nome+' – '+AREA[r.area].nome:'',M,W,1,true);y+=LH+.8;
  field('Objetivos manifestados pelo paciente:',p.objPaciente,M,W,2);y+=LH+3;
  ensure(16);font('normal',10);doc.text('Encaminhamento para Therasuit',M,y);bx=M+doc.getTextWidth('Encaminhamento para Therasuit')+3;bx=box(bx,'Sim',p.therasuit==='sim');box(bx,'Não',p.therasuit==='nao');y+=LH;
  doc.text('Encaminhamento para Fisioterapia Aquática',M,y);bx=M+doc.getTextWidth('Encaminhamento para Fisioterapia Aquática')+3;bx=box(bx,'Sim',p.aquatica==='sim');box(bx,'Não',p.aquatica==='nao');y+=LH+4;
  function secao(titulo,suf,campo){ensure(20);font('normal',10);ink();doc.text('Objetivos em ',M,y);let x=M+doc.getTextWidth('Objetivos em ');font('bold',10);doc.text(titulo,x,y);x+=doc.getTextWidth(titulo);font('normal',10);doc.text(' '+suf,x,y);y+=LH+.5;
    AREAS.forEach(a=>{ensure(LH*2);const val=p.equipe[a.k]?(p.areas[a.k]?.[campo]||''):'Não se aplica';field(a.form,val,M,W,2);y+=LH+.2});y+=2}
  secao('MÉDIO PRAZO','(6 meses)','medio');
  secao('LONGO PRAZO','(12 meses)','longo');
  // tabela de assinaturas
  ensure(52);const cw=W/5,th=31;
  for(let i=0;i<SIG_ORDER.length;i++){const k=SIG_ORDER[i];const x=M+i*cw;doc.rect(x,y,cw,th);font('normal',9);ink();doc.text(doc.splitTextToSize(AREA[k].sig,cw-3),x+1.5,y+4.5);const pr=prof(p.equipe[k]);const sg=!GOV()&&p.equipe[k]&&p.areas[k]?.assinatura;
    if(sg){try{doc.addImage(await sigImg(sg),'PNG',x+2.5,y+6.5,30,10)}catch(e){}font('normal',6);blue();doc.text('Ass. eletrônica '+fmtD(sg.em),x+1.5,y+18.8);doc.text('Cód. '+sg.codigo,x+1.5,y+21.6)}
    const ga=p.equipe[k]&&gAss[p.equipe[k]];if(ga){font('bold',6.4);doc.setTextColor(34,105,63);doc.text('Assinado digitalmente',x+1.5,y+12);font('normal',6.2);doc.text('via gov.br em '+fmtD(ga.em),x+1.5,y+15)}
    if(pr){font('normal',7);blue();doc.text(doc.splitTextToSize(pr.nome,cw-3)[0],x+1.5,y+th-5.6);doc.text(doc.splitTextToSize(pr.registro||'',cw-3)[0],x+1.5,y+th-2.2)}ink()}
  y+=th+4.5;font('bold',8.5);ink();doc.text('•  APÓS 12 MESES DE TRATAMENTO FAZER NOVO PTS PARA CONTINUIDADE DO TRATAMENTO',M+4,y);
  y+=13;font('normal',10);doc.text('Data Explicação:',M,y);const dx=M+doc.getTextWidth('Data Explicação:')+2;doc.line(dx,y+1.2,dx+26,y+1.2);if(p.dataExplicacao){blue();doc.text(fmtD(p.dataExplicacao),dx+1,y);ink()}
  const sx1=M+58,sx2=M+124,sw=56;doc.line(sx1,y-4,sx1+sw,y-4);doc.line(sx2,y-4,sx2+sw,y-4);font('normal',9.5);doc.text('Assinatura e Carimbo',sx1+sw/2,y+.5,{align:'center'});if(gAss[p.respId]){font('normal',6.2);doc.setTextColor(34,105,63);doc.text('Assinado digitalmente via gov.br em '+fmtD(gAss[p.respId].em),sx1+sw/2,y+4,{align:'center'});ink();font('normal',9.5)}
  if(!GOV()&&p.assResp){try{doc.addImage(await sigImg(p.assResp),'PNG',sx1+sw/2-15,y-14.5,30,10)}catch(e){}font('normal',5.8);blue();doc.text('Ass. eletrônica '+fmtD(p.assResp.em)+' · Cód. '+p.assResp.codigo,sx1+sw/2,y+4,{align:'center'});ink();font('normal',9.5)}doc.text('Paciente ou Responsável',sx2+sw/2,y+.5,{align:'center'});
  // rodapé discreto
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);font('normal',7);doc.setTextColor(140);doc.text('Gerado pelo PTS Compartilhado em '+fmtD(todayStr())+(GOV()?(opt.versao?' · Versão para assinatura '+opt.versao:'')+'. Assinaturas digitais gov.br conferíveis em validar.iti.gov.br.':'. Assinaturas eletrônicas da equipe conferíveis pelo código na aba "Verificar assinatura".')+(n>1?' · página '+i+' de '+n:''),M,292)}
  const blob=doc.output('blob');if(opt&&opt.retornar)return blob;
  salvarArquivo('PTS_'+slug(p.prontuario||'sem-prontuario')+'_'+slug(p.nome)+'.pdf',blob);
}

migrar();
})();
